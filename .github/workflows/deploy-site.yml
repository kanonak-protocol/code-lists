name: Deploy Publisher Site

# Builds the codes.kanonak.org publisher origin from the generated code-list
# packages in this repository and deploys it to GitHub Pages. Same shape as
# the kanonak.org site deploy: one `kanonak publish` produces the human pages
# and the machine endpoints (.well-known/kanonak.json, kanonak.lock, raw
# {package}/{version}.kan.yml sources); only CNAME and .nojekyll are
# GitHub-Pages-specific.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Kanonak CLI
        # Pinned, as every tool a workflow runs is: a newer CLI reaches the
        # published site only by a reviewed change to this line.
        run: npm install -g @kanonak-protocol/cli@6.9.0

      - name: Build the publisher origin
        # The vocabularies the lists are typed with (code-lists, language-tag)
        # live on kanonak.org and resolve over HTTP.
        run: kanonak publish --workspace . --out _site

      - name: Add GitHub Pages host specifics
        run: |
          cp CNAME _site/CNAME
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
