name: Test

# Every pull request and every push to main runs the producers' tests: each
# list's fixtures project to its golden, byte for byte, deterministically,
# with zero validation errors, under the package-producer contract. Then every
# package in the newest version's closure of each list must hash at the
# version that states it, and every published version must have its release
# lock, so a list no consumer can hash is refused here, not downstream.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install producers
        working-directory: producers
        run: npm ci

      - name: Test producers
        working-directory: producers
        run: npm test

      - name: Every package in each list's closure hashes
        working-directory: producers
        run: node dist/src/closures.js

      - name: Every published version has its release lock
        run: producers/node_modules/.bin/kanonak release-lock --check
