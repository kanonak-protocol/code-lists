name: Test

# Every pull request and every push to main runs the producers' tests: each
# list's fixtures project to its golden, byte for byte, deterministically,
# with zero validation errors, under the package-producer contract.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install producers
        working-directory: producers
        run: npm ci

      - name: Test producers
        working-directory: producers
        run: npm test
