language-tags:
  type: Package
  publisher: codes.kanonak.org
  version: 2026.9.17
  imports:
    - publisher: kanonak.org
      packages:
        - package: code-lists
          match: ^
          version: 1.0.0
          alias: cl
        - package: core-owl
          match: ^
          version: 2.2.0
          alias: owl
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
        - package: language-tag
          match: ^
          version: 1.0.0
          alias: lt
        - package: provenance
          match: ^
          version: 1.0.0
          alias: prov
  label: Language Tags
  comment: Every registered BCP 47 subtag and tag from the IANA Language Subtag Registry at its 2026-09-17 revision — 9292 entries plus 3 composed tags the registry names as preferred values; 4 private-use ranges are excluded. Generated by the language-tags producer from the source named in the iana-language-subtag-registry record; do not edit — a new registry revision is a new package version.
iana-language-subtag-registry:
  type: cl.CodeList
  label: IANA Language Subtag Registry
  comment: 'The provenance of this package: projected from the IANA Language Subtag Registry at its 2026-09-17 revision by the language-tags producer in the kanonak-protocol/code-lists repository. Verify against each source by its URL and digest; regenerate by running the producer.'
  cl.source:
    type: prov.Standard
    label: IANA Language Subtag Registry
    prov.sourceUrl: https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry
    cl.sourceVersion: '2026-09-17'
    cl.sourceDigest: sha256:755fad43283be7b41ebe3c89ad054b6eaf928f404f9c0edb74799e0eab74beb1
  cl.producer: language-tags
  cl.entryClass:
    - lt.LanguageSubtag
    - lt.ExtlangSubtag
    - lt.ScriptSubtag
    - lt.RegionSubtag
    - lt.VariantSubtag
    - lt.GrandfatheredTag
    - lt.RedundantTag
    - lt.LanguageTag
  cl.entryCount: 9295
