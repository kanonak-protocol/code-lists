  label: Language Tags
  comment: Every registered BCP 47 subtag and tag from the IANA Language Subtag Registry at its 2026-09-17 revision — 29 entries plus 2 composed tags the registry names as preferred values; 1 private-use range is excluded. Generated by the language-tags producer from the source named in the iana-language-subtag-registry record; do not edit — a new registry revision is a new package version.
iana-language-subtag-registry:
  type: cl.CodeList
  label: IANA Language Subtag Registry
  comment: 'The provenance of this package: projected from the IANA Language Subtag Registry at its 2026-09-17 revision by the language-tags producer in the kanonak-protocol/code-lists repository. Verify against each source by its URL and digest; regenerate by running the producer.'
  cl.source:
    type: prov.Standard
    label: IANA Language Subtag Registry
    prov.sourceUrl: https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry
    cl.sourceVersion: '2026-09-17'
    cl.sourceDigest: sha256:b9eabeb2bcc18bdc42656ecdc15810d7bb65bfe621609b6d4fc74cffaedbc4db
  cl.producer: language-tags
  cl.entryClass:
    - lt.LanguageSubtag
    - lt.ExtlangSubtag
    - lt.ScriptSubtag
    - lt.RegionSubtag
    - lt.VariantSubtag
    - lt.GrandfatheredTag
    - lt.RedundantTag
    - lt.LanguageTag
  cl.entryCount: 31
